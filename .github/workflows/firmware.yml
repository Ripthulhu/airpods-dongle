name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: C sanitizers and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: firmware-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build python3
      - name: Run regression tests with ASan and UBSan
        run: python3 tools/test.py --sanitize
      - name: Test release packaging and safe publication
        run: |
          python3 .github/scripts/package_firmware.py --self-test
          python3 .github/scripts/publish_firmware_release.py --self-test
      - name: Test experimental .0076 startup and native adapter
        run: |
          python3 tools/test_radio0076.py
          printf 'y\ny\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=1 --install "ndk;30.0.14904198"
          python3 -m venv "$RUNNER_TEMP/radio0076-tests"
          "$RUNNER_TEMP/radio0076-tests/bin/pip" install -r tests/radio0076/native/requirements.txt
          "$RUNNER_TEMP/radio0076-tests/bin/python" tools/test_radio0076_native.py --toolchain "$ANDROID_HOME/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - name: Verify live bitrate changes with the real AAC encoder and decoder
        run: python3 tools/test_adaptive_codec.py --sanitize

  firmware:
    name: Unified Pico 2 W firmware (.0076)
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: firmware-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.package.outputs.commit }}
      version: ${{ steps.package.outputs.version }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install firmware toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build python3 git pkg-config libusb-1.0-0-dev \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm
      - name: Prepare pinned Pico SDK and verified patches
        run: python3 tools/prepare_sdk.py --sdk .sdk/pico-sdk
      - name: Test AVRCP volume, phone decoders and jitter handling
        run: |
          python3 tools/test_volume_sdk.py --sdk .sdk/pico-sdk --sanitize
          python3 tools/test_cyw43_transport.py --sdk .sdk/pico-sdk --sanitize
          python3 tools/test_phone_codecs.py --sdk .sdk/pico-sdk --sanitize
          python3 tools/lhdc_probe/run.py --sanitize
      - name: Configure Release firmware
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_SDK_PATH="$PWD/.sdk/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAIRPODS_USB_FLOAT=ON \
            -DAIRPODS_EXPERIMENTAL_RADIO0076=ON
      - name: Build and validate firmware
        run: cmake --build build --parallel 2
      - name: Package checked outputs
        id: package
        run: python3 .github/scripts/package_firmware.py --sdk .sdk/pico-sdk
      - name: Upload firmware download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airpods-dongle-pico2w
          path: build/artifact/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish unified firmware
    if: github.repository == 'Ripthulhu/airpods-dongle' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: firmware-github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.firmware.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airpods-dongle-pico2w
          path: artifacts
      - name: Publish complete preview as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.firmware.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.firmware.outputs.commit }}
          FIRMWARE_VERSION: ${{ needs.firmware.outputs.version }}
        run: python3 .github/scripts/publish_firmware_release.py artifacts
